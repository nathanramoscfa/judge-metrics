# .github/workflows/ci.yml
# Continuous integration: mirrors the local pre-commit gate (ruff, mypy,
# bandit, secret scan, dependency audit), runs the Python test suite against
# a PostgreSQL service, lints, type-checks, tests, builds, and audits the web
# application, runs the Playwright smoke test against the API over the FJC
# and golden synthetic fixtures, and builds and vulnerability-scans the API
# and web images. The aggregate `test` job is the single required status check on `main`.
#
# Trust boundary rules (ROADMAP.md §5 "Per-step security gate"):
#   - every third-party action is pinned to a full commit SHA;
#   - the workflow declares least-privilege `permissions:`;
#   - no repository secret is exposed to pull-request-triggered runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_LINK_MODE: copy

jobs:
  python:
    name: python (lint, format, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # CI-only throwaway credentials for the service container; the
          # database is discarded with the runner. Used from Step 2 on.
          POSTGRES_USER: judgemetrics
          POSTGRES_PASSWORD: ci-only-not-a-secret # pragma: allowlist secret
          POSTGRES_DB: judgemetrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judgemetrics -d judgemetrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JUDGEMETRICS_ENV: test
      # The API role for the tests' read-only engine and the readiness probe;
      # migrations and write fixtures run as the container's owner. The
      # three application roles are created below from the Compose init
      # scripts with these CI-only passwords.
      JUDGEMETRICS_DATABASE_URL: postgresql+psycopg://judgemetrics_app:ci-only-app@localhost:5432/judgemetrics # pragma: allowlist secret
      JUDGEMETRICS_ADMIN_DATABASE_URL: postgresql+psycopg://judgemetrics:ci-only-not-a-secret@localhost:5432/judgemetrics # pragma: allowlist secret
      # The scratch test database (tests/conftest.py `test_settings`): the
      # throwaway service database itself, as its owner — one database is
      # enough here; locally it is `judgemetrics_test` beside a live ingest.
      JUDGEMETRICS_TEST_DATABASE_URL: postgresql+psycopg://judgemetrics:ci-only-not-a-secret@localhost:5432/judgemetrics # pragma: allowlist secret
      # Hypothesis profile for tests/property (50 examples, no deadline).
      HYPOTHESIS_PROFILE: ci
      JUDGEMETRICS_LOG_FORMAT: json
      # Pepper for person-identifier hashes (a fixed CI-only value; the
      # test suite sets its own constant regardless).
      JUDGEMETRICS_IDENTIFIER_PEPPER: ci-only-pepper-not-a-secret # pragma: allowlist secret
      JUDGEMETRICS_APP_DB_PASSWORD: ci-only-app # pragma: allowlist secret
      JUDGEMETRICS_INGEST_DB_PASSWORD: ci-only-ingest # pragma: allowlist secret
      JUDGEMETRICS_ADMIN_DB_PASSWORD: ci-only-admin # pragma: allowlist secret
      POSTGRES_USER: judgemetrics
      POSTGRES_DB: judgemetrics
      PGPASSWORD: ci-only-not-a-secret # pragma: allowlist secret
      # MinIO for the S3 raw-store contract test (tests/integration/
      # test_store_s3.py); CI-only credentials for a throwaway container.
      JUDGEMETRICS_RAW_STORE_URL: s3://judgemetrics-raw
      JUDGEMETRICS_S3_ENDPOINT_URL: http://localhost:9000
      JUDGEMETRICS_S3_ACCESS_KEY_ID: ci-only-minio # pragma: allowlist secret
      JUDGEMETRICS_S3_SECRET_ACCESS_KEY: ci-only-not-a-secret # pragma: allowlist secret
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --frozen

      # The scratch-database script runs too, so a broken init script fails
      # here rather than on a developer's next `uv run poe up`; the tests
      # still use the service database (JUDGEMETRICS_TEST_DATABASE_URL above).
      - name: Create the database roles and the scratch database (same init scripts as Compose)
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -f infra/docker/postgres/01-extensions.sql \
            -f infra/docker/postgres/02-roles.sql \
            -f infra/docker/postgres/03-test-database.sql

      - name: Start MinIO (S3 raw-store contract test)
        env:
          MINIO_ROOT_USER: ci-only-minio # pragma: allowlist secret
          MINIO_ROOT_PASSWORD: ci-only-not-a-secret # pragma: allowlist secret
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Lint
        run: uv run poe lint

      - name: Format check
        run: uv run poe fmt-check

      - name: Type check
        run: uv run poe typecheck

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  security:
    name: security (secret scan, SAST, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (full history for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # The automatic, read-only workflow token (not a repository secret);
          # gitleaks uses it only to read the PR's commit range.
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --frozen

      - name: SAST (bandit)
        run: uv run bandit -c pyproject.toml -r src alembic

      - name: Dependency audit (pip-audit --strict over uv.lock)
        run: uv run python scripts/audit_deps.py

  web:
    name: web (lint, types, build, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm comes from corepack at the version `packageManager` pins in
      # web/package.json, after Node so the shims belong to that Node.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install (locked)
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint incl. eslint-plugin-security)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # The build precedes the tests so the bundle scan (no JUDGEMETRICS_
      # variable in the output) has a production build to inspect.
      - name: Production build
        run: pnpm build

      - name: Unit tests (Vitest; schema freshness; bundle scan)
        run: pnpm test

      - name: Dependency audit (pnpm audit, high and above)
        run: pnpm audit --audit-level=high

  e2e:
    name: e2e (Playwright smoke against the API over the FJC and golden fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          # CI-only throwaway credentials, as in the python job.
          POSTGRES_USER: judgemetrics
          POSTGRES_PASSWORD: ci-only-not-a-secret # pragma: allowlist secret
          POSTGRES_DB: judgemetrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judgemetrics -d judgemetrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JUDGEMETRICS_ENV: test
      JUDGEMETRICS_DATABASE_URL: postgresql+psycopg://judgemetrics_app:ci-only-app@localhost:5432/judgemetrics # pragma: allowlist secret
      JUDGEMETRICS_ADMIN_DATABASE_URL: postgresql+psycopg://judgemetrics_admin:ci-only-admin@localhost:5432/judgemetrics # pragma: allowlist secret
      JUDGEMETRICS_INGEST_DATABASE_URL: postgresql+psycopg://judgemetrics_ingest:ci-only-ingest@localhost:5432/judgemetrics # pragma: allowlist secret
      JUDGEMETRICS_RAW_STORE_URL: file://./data/lake
      JUDGEMETRICS_LOG_FORMAT: json
      JUDGEMETRICS_IDENTIFIER_PEPPER: ci-only-pepper-not-a-secret # pragma: allowlist secret
      JUDGEMETRICS_APP_DB_PASSWORD: ci-only-app # pragma: allowlist secret
      JUDGEMETRICS_INGEST_DB_PASSWORD: ci-only-ingest # pragma: allowlist secret
      JUDGEMETRICS_ADMIN_DB_PASSWORD: ci-only-admin # pragma: allowlist secret
      POSTGRES_USER: judgemetrics
      POSTGRES_DB: judgemetrics
      PGPASSWORD: ci-only-not-a-secret # pragma: allowlist secret
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install the API (locked)
        run: uv sync --frozen

      - name: Create the database roles (same init scripts as Compose)
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -f infra/docker/postgres/01-extensions.sql \
            -f infra/docker/postgres/02-roles.sql

      - name: Migrate (admin role)
        run: uv run poe migrate

      - name: Ingest the FJC fixture (ingest role)
        run: uv run judgemetrics ingest run fjc --from-fixture tests/fixtures/fjc

      # The golden synthetic dataset (tests/fixtures/golden: manifest.json
      # beside source/) gives the case flow a synthetic judge and case; the
      # job's JUDGEMETRICS_IDENTIFIER_PEPPER hashes its participant ids.
      - name: Ingest the golden synthetic fixture (ingest role)
        run: uv run judgemetrics ingest run synthetic --from-fixture tests/fixtures/golden

      - name: Start the API in the background
        run: |
          nohup uv run judgemetrics serve --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/ready && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/ready

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm comes from corepack at the version `packageManager` pins in
      # web/package.json, after Node so the shims belong to that Node.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install the web app (locked)
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build and start the web app in the background
        working-directory: web
        run: |
          pnpm build
          nohup pnpm start > ../web.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/methodology > /dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/methodology

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke test
        working-directory: web
        run: pnpm e2e

      - name: Server logs (on failure)
        if: failure()
        run: |
          echo "::group::api.log"; cat api.log || true; echo "::endgroup::"
          echo "::group::web.log"; cat web.log || true; echo "::endgroup::"

      - name: Upload the Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: container (API and web image builds and vulnerability scans)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build -f infra/docker/api.Dockerfile --build-arg "GIT_SHA=$GITHUB_SHA" -t judgemetrics-api:ci .

      - name: Smoke the API image (non-root, no .env, CLI answers)
        run: |
          test "$(docker run --rm judgemetrics-api:ci id -u)" = "10001"
          docker run --rm judgemetrics-api:ci sh -c '! test -e /app/.env'
          docker run --rm judgemetrics-api:ci judgemetrics --version

      - name: Vulnerability scan of the API image (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: judgemetrics-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Build the web image
        run: docker build -f infra/docker/web.Dockerfile -t judgemetrics-web:ci web

      - name: Smoke the web image (non-root, no .env, serves a page)
        run: |
          test "$(docker run --rm judgemetrics-web:ci id -u)" = "10001"
          docker run --rm judgemetrics-web:ci sh -c '! test -e /app/.env'
          docker run -d --rm --name web -p 3000:3000 judgemetrics-web:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/methodology > /dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000/methodology
          docker stop web

      - name: Vulnerability scan of the web image (fail on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: judgemetrics-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  test:
    # The single required status check for `main`: green only when every
    # job it needs succeeded (a skipped or cancelled job is a failure here).
    name: test
    runs-on: ubuntu-latest
    needs: [python, security, container, web, e2e]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every needed job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
          echo "all required jobs succeeded"
