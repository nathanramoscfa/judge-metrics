# alembic.ini
# Alembic configuration. The database URL is NOT here: alembic/env.py reads
# it from the application settings (JUDGEMETRICS_ADMIN_DATABASE_URL, falling
# back to JUDGEMETRICS_DATABASE_URL). Prefer `uv run judgemetrics db ...`
# (or `uv run poe migrate`) over calling alembic directly.
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
