# docker-compose.yml
# Local services for development: PostgreSQL 17 (pg_trgm, three application
# roles) and MinIO (S3-compatible raw object lake). Values come from `.env`
# (copy `.env.example`; `.env` is never tracked). The `api` and `web` services
# (profile `app`) build the application images and are opt-in:
# `docker compose --profile app up`. `uv run poe up` / `uv run poe down` wrap
# `docker compose`.
name: judgemetrics

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Read by infra/docker/postgres/02-roles.sql via psql \getenv.
      JUDGEMETRICS_APP_DB_PASSWORD: ${JUDGEMETRICS_APP_DB_PASSWORD:?set in .env}
      JUDGEMETRICS_INGEST_DB_PASSWORD: ${JUDGEMETRICS_INGEST_DB_PASSWORD:?set in .env}
      JUDGEMETRICS_ADMIN_DB_PASSWORD: ${JUDGEMETRICS_ADMIN_DB_PASSWORD:?set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./infra/docker/postgres/02-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio:
    # MinIO publishes its official images on Quay (the Docker Hub repository
    # is no longer served).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    # Runs once after MinIO is healthy: creates the raw-lake bucket with
    # object versioning enabled (the brief's "object-store versioning for
    # raw data") and, when JUDGEMETRICS_S3_ACCESS_KEY_ID differs from the
    # root user, the application user the ingest runner connects as
    # (readwrite policy). Idempotent; then exits.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      RAW_BUCKET: ${JUDGEMETRICS_RAW_BUCKET:-judgemetrics-raw}
      APP_ACCESS_KEY_ID: ${JUDGEMETRICS_S3_ACCESS_KEY_ID:-}
      APP_SECRET_ACCESS_KEY: ${JUDGEMETRICS_S3_SECRET_ACCESS_KEY:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$RAW_BUCKET"
        mc version enable "local/$$RAW_BUCKET"
        mc version info "local/$$RAW_BUCKET"
        if [ -n "$$APP_ACCESS_KEY_ID" ] && [ "$$APP_ACCESS_KEY_ID" != "$$MINIO_ROOT_USER" ]; then
          mc admin user add local "$$APP_ACCESS_KEY_ID" "$$APP_SECRET_ACCESS_KEY"
          mc admin policy attach local readwrite --user "$$APP_ACCESS_KEY_ID" \
            || echo "readwrite policy already attached to the application user"
        fi
    restart: "no"

  api:
    # The API image (infra/docker/api.Dockerfile), reachable on port 8000.
    # Configuration comes from `.env`; the in-network hostnames for the
    # database and object store override the localhost values in `.env`.
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        # `GIT_SHA=$(git rev-parse HEAD) docker compose --profile app build`
        # stamps /api/v1/health; unset, the image reports `unknown`.
        GIT_SHA: ${GIT_SHA:-unknown}
    image: judgemetrics-api:local
    env_file: .env
    environment:
      JUDGEMETRICS_ENV: local
      JUDGEMETRICS_DATABASE_URL: postgresql+psycopg://judgemetrics_app:${JUDGEMETRICS_APP_DB_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      JUDGEMETRICS_ADMIN_DATABASE_URL: postgresql+psycopg://judgemetrics_admin:${JUDGEMETRICS_ADMIN_DB_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      JUDGEMETRICS_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    # The web image (infra/docker/web.Dockerfile), reachable on port 3000.
    # NEXT_PUBLIC_API_BASE_URL is inlined at build time; inside the Compose
    # network the API is `http://api:8000`, and WEB_API_BASE_URL in `.env`
    # overrides it when the browser must reach the API another way.
    profiles: ["app"]
    build:
      context: web
      dockerfile: ../infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${WEB_API_BASE_URL:-http://api:8000}
    image: judgemetrics-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
