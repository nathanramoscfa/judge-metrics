# data/reference/case_vocabulary.yaml
# The versioned case-level vocabulary every connector maps onto
# (docs/DATA_MODEL.md "Vocabularies"). Loaded once by
# judgemetrics.normalization.vocabulary; equal to the constants in
# judgemetrics.synthetic.vocabulary (unit test). Bump `version` whenever a
# value is added, renamed, or removed, and record the change in
# docs/DATA_MODEL.md; Phase 5's real-source connectors map their source
# values onto these and never extend them silently. Version 2 (Phase 4
# Step 1) adds the restricted vocabularies - restricted_attribute, age_band,
# synthetic_group - whose values live only in the `restricted` schema.
# Version 3 (Phase 5 Step 3) adds exactly the values the Cook County rule
# tables (data/reference/cook_sao/) use: the Illinois offense classes and two
# offense categories, the non-final dispositions `superseded` and
# `transferred` with `final_charge_disposition` (the dispositions that end a
# charge on its merits, the only ones the engine counts as disposed), the
# court events, charging and diversion decisions, sentence components,
# phases, and term flags of that source, the position for an unstated rank,
# the charging outcomes, diversion stages, and judicial rulings the tables
# record, and the restricted kinds `race` and `gender` - the source's own
# category labels, normalized (letter case and punctuation) but not recoded.
version: 3
kinds:
  case_type:
    - felony
    - misdemeanor
  case_status:
    - open
    - closed
  party_type:
    - defendant
  assignment_type:
    - initial
    - reassignment
  event_type:
