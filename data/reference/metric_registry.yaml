    kind: survival
    subject_types: [judge, court]
    population: index_events
    description: >-
      The Kaplan-Meier cumulative incidence of a conviction in another case by
      each window, over the whole pretrial-release cohort with censoring at
      the coverage end.
    numerator: >-
      1 - S(w), the product-limit survival evaluated at w days, with the
      Greenwood standard error and a symmetric 95% interval clipped to [0, 1].
    denominator: >-
      The whole cohort: every member contributes time at risk from its
      exposure start until its first reconviction event in another case of the
      person or the coverage end, whichever comes first.
    eligibility: >-
      The pretrial-release cohort: attributed pretrial decisions (the gate of
      pretrial_decisions) with detained = false and a release time; the index
      time is the release time, and exposure starts there unless an
      incarceration term of the person contains it (Exposure).
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    index_event: pretrial_release
    outcome: reconviction
    windows_days: [30, 90, 180, 365, 730, 1095]
    dimension: null
    suppression_threshold: 10
    unit: share
    version: "1"

