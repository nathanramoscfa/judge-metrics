  # --- dispositions ------------------------------------------------------------
  - slug: disposition_distribution
    name: Disposition distribution
    kind: distribution
    subject_types: [judge, court]
    population: disposed_charges
    description: The attributed disposed charges counted by final disposition value.
    numerator: Attributed disposed charges with the dimension's final disposition value.
    denominator: "Not applicable: a distribution of counts."
    eligibility: >-
      Counts of the judicial_dismissal_rate denominator charges by final
      disposition value - dismissed, acquitted, convicted_plea,
      convicted_verdict, zero counts included; a pending, superseded, or
      transferred charge is not disposed and is no value of the distribution.
      Judge: the charges whose disposing judge is the judge.
    attribution:
      decision_type: null
      actor_types: null
      discretion: null
      assignment_gate: disposing_judge
    index_event: null
    outcome: null
    windows_days: null
    dimension: disposition
    suppression_threshold: 0
    unit: count
    version: "2"
    truth_note: >-
      truth/metrics.json counts by disposition value; every disposition of the
      synthetic world is final, and its connector records the judge assigned
      at a charge's disposition as the disposing judge, so the counts are the
      same.

  - slug: judicial_dismissal_rate
    name: Judicial dismissal rate
    kind: share
    subject_types: [judge, court]
    population: disposed_charges
    description: >-
      The share of attributed disposed charges that a judge dismissed; a
      prosecutor's dismissal is not a judicial dismissal.
    numerator: Attributed charges disposed as dismissed with disposition_actor judge.
    denominator: >-
      Attributed charges with a final disposition (dismissed, acquitted,
      convicted_plea, convicted_verdict) and a disposition time.
    eligibility: >-
      numerator = charges disposed as dismissed with disposition_actor judge;
      denominator = charges with a final disposition and a disposition time (a
      pending, superseded, or transferred charge, or one without a
      disposition, is not disposed). Judge: charges whose disposing judge -
      the judge the source records as entering the charge's disposition - is
      the judge. Court: charges of the court's cases.
    attribution:
      decision_type: null
      actor_types: null
      discretion: null
      assignment_gate: disposing_judge
    counted:
      disposition: dismissed
      disposition_actor: judge
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 10
    unit: share
    version: "2"
    truth_note: >-
      truth/metrics.json takes a judge's charges as those disposed inside one
      of the judge's assignment intervals and the denominator as a disposition
      other than pending or missing; the synthetic connector records the judge
      assigned at the disposition as the disposing judge and every synthetic
      disposition is final, so the numbers are the same.

  - slug: median_days_to_disposition
    name: Median days to disposition
    kind: median
    subject_types: [judge, court]
    population: disposed_cases
    description: The median number of whole days from filing to the case disposition.
    numerator: >-
      The median of (case disposition date - filed date) in whole days over
      the attributed disposed cases.
    denominator: The number of attributed disposed cases (the sample size).
    eligibility: >-
      Median over disposed cases of (case disposition date - filed_date) in
      whole days, where the case disposition is the latest disposed_at among
      its charges with a final disposition; a case the source disposes before
      its filing date has no value and is counted among the eligible cases
      only. Judge: cases whose disposing judge - the judge on the charge
      whose disposal sets the case disposition time, ties broken by the
      source's charge id - is the judge. Court: the court's disposed cases.
    attribution:
      decision_type: null
      actor_types: null
      discretion: null
      assignment_gate: disposing_judge
    measure: days_to_disposition
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 10
    unit: days
    version: "2"
    truth_note: >-
      truth/metrics.json attributes a case to the judge assigned at the case
      disposition time, whom the synthetic connector records as the disposing
      judge of the charge that sets that time; no synthetic case is disposed
      before its filing.

