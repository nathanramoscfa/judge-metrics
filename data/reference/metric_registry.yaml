metrics:
  # --- eligibility -------------------------------------------------------------
  - slug: eligible_cases
    name: Eligible cases
    kind: count
    subject_types: [judge, court]
    population: cases
    description: The number of cases the subject is measured over.
    numerator: >-
      Distinct cases with at least one assignment of the judge (court: cases
      filed in the court).
    denominator: "Not applicable: a count."
    eligibility: >-
      Judge: cases with at least one assignment of the judge. Court: cases
      filed in the court. Duplicate source records count once.
    attribution:
      decision_type: null
      actor_types: null
      discretion: null
      assignment_gate: assigned_ever
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 0
    unit: count
    version: "1"

  - slug: eligible_defendants
    name: Eligible defendants
    kind: count
    subject_types: [judge, court]
    population: defendants
    description: >-
      The number of distinct persons among the eligible cases: resolved
      persons after entity resolution, which is what the truth's true persons
      are once the planted split persons have merged.
    numerator: Distinct resolved persons among the eligible cases.
    denominator: "Not applicable: a count."
    eligibility: Distinct true persons among the eligible cases.
    attribution:
      decision_type: null
      actor_types: null
      discretion: null
      assignment_gate: assigned_ever
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 0
    unit: count
    version: "1"

  # --- pretrial ----------------------------------------------------------------
  - slug: pretrial_decisions
    name: Pretrial decisions
    kind: count
    subject_types: [judge, court]
    population: pretrial_decisions
    description: The number of discretionary judicial pretrial-release decisions.
    numerator: Attributed pretrial decisions.
    denominator: "Not applicable: a count."
    eligibility: >-
      Pretrial decisions attributed to the subject under the attribution gate:
      decision_type pretrial_release, actor judge, discretion discretionary
      (judge: the deciding judge; court: decided in the court). Statutory
      releases (legislature_or_mandatory_rule, mandatory) and decisions with an
      unknown actor are excluded.
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 0
    unit: count
    version: "1"

  - slug: pretrial_released
    name: Pretrial releases
    kind: count
    subject_types: [judge, court]
    population: pretrial_decisions
    description: The number of attributed pretrial decisions that released the defendant.
    numerator: Attributed pretrial decisions with detained = false.
    denominator: "Not applicable: a count."
    eligibility: Attributed pretrial decisions with detained = false.
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    counted:
      detained_flag: false
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 0
    unit: count
    version: "1"

  - slug: pretrial_detained
    name: Pretrial detentions
    kind: count
    subject_types: [judge, court]
    population: pretrial_decisions
    description: The number of attributed pretrial decisions that detained the defendant.
    numerator: Attributed pretrial decisions with detained = true.
    denominator: "Not applicable: a count."
    eligibility: Attributed pretrial decisions with detained = true.
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    counted:
      detained_flag: true
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 0
    unit: count
    version: "1"

  - slug: pretrial_release_share
    name: Pretrial release share
    kind: share
    subject_types: [judge, court]
    population: pretrial_decisions
    description: The share of attributed pretrial decisions that released the defendant.
    numerator: Attributed pretrial decisions with detained = false (pretrial_released).
    denominator: >-
      Attributed pretrial decisions: released plus detained (pretrial_released
      + pretrial_detained).
    eligibility: >-
      The attributed pretrial decisions of pretrial_decisions; every decision
      carries a detained flag, so the denominator is the whole set.
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    counted:
      detained_flag: false
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 10
    unit: share
    version: "1"
    truth_note: >-
      truth/metrics.json states the formula released_count / (released_count
      + detained_count); the registry states the numerator and denominator
      separately.

  - slug: statutory_release_count
    name: Statutory releases
    kind: count
    subject_types: [court]
    population: pretrial_decisions
    description: >-
      The number of pretrial releases required by statute or mandatory rule,
      which are never attributed to a judge.
    numerator: >-
      Pretrial decisions with actor legislature_or_mandatory_rule and
      discretion mandatory.
    denominator: "Not applicable: a count."
    eligibility: >-
      Court only: pretrial decisions with actor legislature_or_mandatory_rule
      and discretion mandatory (never attributed to a judge).
    attribution:
      decision_type: pretrial_release
      actor_types: [legislature_or_mandatory_rule]
      discretion: [mandatory]
      assignment_gate: court_of_case
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 0
    unit: count
    version: "1"

  - slug: unknown_actor_pretrial_count
    name: Pretrial decisions with an unknown actor
    kind: count
    subject_types: [court]
    population: pretrial_decisions
    description: >-
      The number of pretrial decisions whose actor the source does not
      identify; they enter no judge-level metric.
    numerator: Pretrial decisions with actor unknown.
    denominator: "Not applicable: a count."
    eligibility: >-
      Court only: pretrial decisions with actor unknown (the planted
      missing-judge examples).
    attribution:
      decision_type: pretrial_release
      actor_types: [unknown]
      discretion: null
      assignment_gate: court_of_case
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 0
    unit: count
    version: "1"

  # --- windowed rates after pretrial release -----------------------------------
  - slug: failure_to_appear_rate
    name: Failure-to-appear rate after pretrial release
    kind: windowed_rate
    subject_types: [judge, court]
    population: index_events
    description: >-
      The share of followed pretrial-release cohort members with a documented
      failure to appear within the window.
    numerator: >-
      Followed cohort members with at least one failure_to_appear event in
      (exposure start, exposure start + w days], in any case of the person.
    denominator: >-
      Cohort members followed for the window (exposure start + w days strictly
      before the coverage end).
    eligibility: >-
      The pretrial-release cohort: attributed pretrial decisions (the gate of
      pretrial_decisions) with detained = false and a release time; the index
      time is the release time, and exposure starts there unless an
      incarceration term of the person contains it (Exposure).
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    index_event: pretrial_release
    outcome: failure_to_appear
    windows_days: [30, 90, 180, 365, 730, 1095]
    dimension: null
    suppression_threshold: 10
    unit: share
    version: "1"
    truth_note: >-
      truth/metrics.json states the window rule once under pretrial.windows;
      the registry states the cohort here and the window rule in the
      methodology.

