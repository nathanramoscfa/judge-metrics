# data/reference/metric_registry.yaml
# The versioned metric registry: the contract every published number is
# computed against (docs/METHODOLOGY.md is rendered from this file by
# `judgemetrics methodology render`; `judgemetrics.metrics.registry` loads
# it with yaml.safe_load and validates every value against the case
# vocabulary and the fixed enumerations; `sync_definitions` mirrors every
# entry into `metric_definition` on (slug, version)).
#
# Versioning: `version` is bumped whenever an entry is added, removed, or
# changed in a way that changes a published number; a changed entry also
# bumps its own `version` (old definition rows stay as history);
# `methodology_version` is bumped when the semantics stated in the
# methodology change (0.1 is the first registry; 1.0 is Phase 4's; 1.1 is
# Phase 5 Step 5's real-data semantics). Version 3 (methodology 1.1) adds the
# assignment gate disposing_judge and moves the disposition family to it, reads
# the vocabulary's finality in every disposed population, counts each
# sentencing decision once, declares the calendar-year periods and the
# revocation scopes, and states every threshold's rationale beside the cohort
# sizes it was decided against.
#
# Fields per metric: slug (snake_case, unique), name, kind (count, share,
# windowed_rate, survival, distribution, median, observed_expected),
# subject_types (judge, court), population (which rows the metric reads:
# cases, defendants, pretrial_decisions, disposed_charges, disposed_cases,
# sentences, index_events), description, numerator, denominator,
# eligibility (prose the methodology publishes), attribution (decision_type, actor_types,
# discretion, assignment_gate: deciding_judge, assigned_at_time,
# assigned_ever, sentencing_judge, disposing_judge, court_of_case - the gate
# applies to a judge subject, and a source that does not record it publishes no
# observation of the metric for its judges (NotAttributable); a court subject
# always takes the court's cases),
# counted (optional column conditions a row must meet to enter the
# numerator or the count), measure (medians: the quantity), index_event
# (pretrial_release, disposition, sentence, or null), outcome (a
# justice_event_type value or null), windows_days (the brief's six or
# null), dimension (disposition, offense_category, or null),
# suppression_threshold, unit (count, share, days, ratio), version, an
# optional truth_note stating how the prose differs from the golden
# fixture's truth/metrics.json definitions, and - for an observed_expected
# metric only, where it is required - adjustment (target: the outcome
# model specification's target the ratio reads, data/reference/
# outcome_model.yaml; minimum_expected: the model-expected count below which
# the ratio is withheld).
#
# Top-level blocks beside the metrics (version 3): periods (the whole window
# and the calendar years, with each population's anchor), revocation_scopes
# (what a revocation is after each index event), and suppression (the rule,
# every threshold's rationale, the measured cohort sizes, and the published
# eligible count). The loader checks that every metric appears in exactly one
# threshold group at the threshold its entry carries, that every suppressed
# metric's threshold carries a measured cohort, and that the anchors are the
# engine's.
version: 3
methodology_version: "1.1"

known_limitations:
  - >-
    A judge who handles a disproportionately high-risk docket may exhibit
    higher raw subsequent-event rates even if decision-making has no causal
    effect. Raw rates must therefore be accompanied by case-mix context.
  - >-
    Selection effects can occur when defendants are not randomly assigned to
    judges.
  - >-
    Changes in prosecutors, policing, statutes, bail law, crime conditions,
    court procedures, and reporting systems can create apparent changes in
    outcomes.
  - >-
    Rearrest measures are partly functions of law-enforcement activity and do
    not equal proven offending.
  - >-
    Missing subsequent events outside the covered jurisdiction can bias
    longitudinal measures downward.
  - >-
    Entity-resolution mistakes can severely distort repeat-event calculations.
  - >-
    Small samples create extreme but unstable observed rates.
  - >-
    Never conceal these limitations merely because a simplified number is
    easier to market.

periods:
  whole_window: >-
    Every metric publishes one observation over the source's whole coverage
    window: period_start is the source's coverage_start and period_end its
    coverage_end. A row enters a period only when its anchor (below) falls
    inside the coverage window, so every counted row lies within the dates the
    observation states; a row whose anchor the source dates outside its own
    window (a typo date, a disposition before the corpus begins) enters no
    observation and stays in the data-quality issues.
  calendar_year:
    kinds: [count, share, windowed_rate, survival, distribution, median]
    anchors:
      cases: filed_at
      defendants: filed_at
      pretrial_decisions: decision_at
      disposed_charges: disposed_at
      disposed_cases: disposition_at
      sentences: sentence_at
      index_events: index_at
    rule: >-
      Beside the whole window, every metric of these kinds publishes one
      observation per calendar year (UTC) in which its population has an
      anchor: the filing for the case counts, the decision for the pretrial
      decisions, the disposition for a disposed charge, the case disposition
      for a disposed case, the sentence for a sentence, and the index time for
      a windowed rate or a survival estimate. period_start and period_end are
      the year's first and last days. A year holds exactly the rows of the
      whole window whose anchor falls in it, so the years' counts,
      numerators, denominators, and followed and counted members add up to the
      whole window's (a distinct count of persons and a median or survival
      estimate do not add). Follow-up is still censored at the coverage end,
      and suppression applies to each year as to any cohort. An
      observed-to-expected ratio is published over the whole window only:
      its cohorts are too small per year.

revocation_scopes:
  definitions:
    release: >-
      A revoked pretrial release: the court revokes the release (or the bond)
      it granted the person before the case was disposed.
    supervision: >-
      A revoked supervision a sentence imposed: probation, conditional
      discharge, parole, or mandatory supervised release revoked for a
      violation of its conditions.
  by_index_event:
    pretrial_release: release
    disposition: supervision
    sentence: supervision

suppression:
  default_threshold: 10
  rule: >-
    An observation whose denominator is below the metric's
    suppression_threshold is stored with suppressed_flag = true and the reason
    below_threshold; every public surface then shows that the cohort was too
    small and withholds the numerator, denominator, value, and interval. An
    observed-to-expected ratio is also suppressed when its model-expected count
    is below the metric's minimum (expected_below_minimum) or its outcome model
    is not fitted (model_unavailable). The rule applies to every period: a
    calendar year whose cohort is below the threshold is withheld like any
    small cohort. The stored row keeps its numbers so `metrics verify` can
    reproduce it.
  rationale: >-
    Every threshold below is stated with its reason and the cohort sizes it
    was decided against (measurements): the measured quantiles of each
    denominator per source, subject type, and period, never a subject's own
    count.
  eligible_count: >-
    A suppressed observation keeps its eligible count public (Phase 3 finding
    3.5, revisited on Cook County's cohorts). Suppression withholds an
    unstable estimate, not the size of a cohort: the counts that are a share's
    denominator and numerator are published as counts in their own right
    (pretrial_decisions, pretrial_released, sentence_count, the disposition
    distribution), every count names cases and decisions, never a person, and
    a reader needs the eligible count to see why a figure is withheld and how
    much of the cohort a window could follow.
  thresholds:
    - threshold: 0
      metrics:
        - eligible_cases
        - eligible_defendants
        - pretrial_decisions
        - pretrial_released
        - pretrial_detained
        - statutory_release_count
        - unknown_actor_pretrial_count
        - disposition_distribution
        - sentence_count
      rationale: >-
        Counts and the disposition distribution are never suppressed: they are
        the sample sizes the presentation rules require beside every rate, a
        count is not an estimate whose noise a threshold could tame, and no
        count has a person-level dimension.
    - threshold: 10
      metrics:
        - pretrial_release_share
        - judicial_dismissal_rate
      rationale: >-
        Below 10 attributed rows one decision moves a share by ten percentage
        points or more. Cook County's judge cohorts are bimodal: a quarter of
        judge-years hold at most four disposed charges (judges the exports name
        on a handful of rows) while the median judge-year holds 25 and the
        upper quartile over 600, so the floor withholds that sparse tail (38%
        of judge-years, 35% of whole windows) and almost nothing else; only 13%
        of judge cohorts sit between 10 and 29, and they are published with
        their 95% Wilson interval (about +/-0.28 at 10, +/-0.17 at 30), which
        states the uncertainty a higher floor would hide. Court cohorts run to
        the thousands. On the demo the floor withholds no whole-window judge
        share and a quarter to a third of judge-years.
    - threshold: 10
      metrics:
        - failure_to_appear_rate
        - new_case_rate
        - new_charge_rate
        - reconviction_rate
        - release_violation_rate
        - revocation_rate
        - rearrest_rate
        - failure_to_appear_survival
        - new_case_survival
        - reconviction_survival
        - new_case_rate_after_disposition
        - new_charge_rate_after_disposition
        - reconviction_rate_after_disposition
        - revocation_rate_after_disposition
        - new_case_rate_after_sentence
        - new_charge_rate_after_sentence
        - reconviction_rate_after_sentence
        - revocation_rate_after_sentence
      rationale: >-
        A fixed-window rate is suppressed below 10 followed members and a
        survival estimate below a cohort of 10: under it one outcome moves the
        rate by ten points or more. The followed cohorts shrink with the window
        and the period - Cook County's judge-years follow a median of 7
        members for a year after a disposition and 4 for three years, and the
        latest years follow none for the longest windows - so the floor
        withholds the sparse tail (45% to 60% of judge-years, as the source
        names many judges on a few rows) while the 6% to 15% of judge cohorts
        between 10 and 29 are published with their interval. Raising the floor
        to 30 would also withhold a third of the demo's whole-window judge
        rates at the longest window without narrowing any published interval.
    - threshold: 10
      metrics:
        - median_days_to_disposition
        - incarceration_days_median
        - probation_days_median
        - incarceration_days_median_by_offense_category
      rationale: >-
        A median of fewer than ten values describes one or two cases. Cook
        County's judges hold a median of 16 disposed cases over the whole
        window and 10 per year, and of 7 to 16 sentences with a term; the floor
        withholds the judges the exports name on a few rows (42% to 54% of
        judge cohorts) and the thin offense categories of a year, while only 6%
        to 15% of judge cohorts sit between 10 and 29 (24% of a category's
        judge-years). A median carries no interval, so the floor is the only
        guard against a single case.
    - threshold: 30
      metrics:
        - pretrial_release_observed_expected
        - new_case_observed_expected
        - failure_to_appear_observed_expected
      rationale: >-
        An observed-to-expected ratio is suppressed below 30 members in the
        ratio and below an expected count of 5: a ratio of two small counts is
        unstable well above the ten members a share needs, because both its
        numerator and its denominator move by chance, and an expected count
        below five makes the ratio a function of a handful of predicted events.
        On the demo the floor withholds 17% to 21% of whole-window judge
        ratios. Cook County publishes no ratio: it does not record the
        deciding judge a ratio is attributed to.
  measurements:
    measured_on: '2026-10-09'
    method: >-
      Counted from the canonical tables through the engine's own population
      rules (the anchor inside the coverage window, finality, the disposing
      and the sentencing judge), never from member rows: the full Cook County
      corpus as ingested on 2026-10-09 (501,012 cases) and the demo seed's
      world (seed 20260916, 5,200 cases). A cohort is one subject and one
      period; its size is the metric's denominator - the attributed rows of a
      share, the rows with a value of a median, the followed members of a
      fixed-window rate at 365 and at 1095 days (a survival estimate's cohort
      is its whole, at least as large). Quantiles are nearest-rank;
      under_threshold is the share of the cohorts below the threshold their
      metrics carry. A source is not measured for a metric it cannot attribute
      or observe.
