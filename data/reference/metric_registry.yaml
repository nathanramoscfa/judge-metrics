  # --- survival (Kaplan-Meier) after pretrial release --------------------------
  - slug: failure_to_appear_survival
    name: Failure-to-appear cumulative incidence after pretrial release
    kind: survival
    subject_types: [judge, court]
    population: index_events
    description: >-
      The Kaplan-Meier cumulative incidence of a documented failure to appear
      by each window, over the whole pretrial-release cohort with censoring at
      the coverage end.
    numerator: >-
      1 - S(w), the product-limit survival evaluated at w days, with the
      Greenwood standard error and a symmetric 95% interval clipped to [0, 1].
    denominator: >-
      The whole cohort: every member contributes time at risk from its
      exposure start until its first failure_to_appear event or the coverage
      end, whichever comes first.
    eligibility: >-
      The pretrial-release cohort: attributed pretrial decisions (the gate of
      pretrial_decisions) with detained = false and a release time; the index
      time and the exposure start are the release time.
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    index_event: pretrial_release
    outcome: failure_to_appear
    windows_days: [30, 90, 180, 365, 730, 1095]
    dimension: null
    suppression_threshold: 10
    unit: share
    version: "1"

