    denominator: >-
      Expected new cases: the sum over the same followed members of the outcome
      model's predicted probability of a new case within the window (target
      new_case, window w), from the published coefficients; a member whose
      model features are missing under an exclude rule is outside the ratio.
    eligibility: >-
