  # --- observed-to-expected ratios (registry version 2, methodology 0.3) -------
  # Computed by the full `metrics compute` only and not served by the API until
  # methodology 1.0 publishes their validation (docs/ARCHITECTURE.md "Risk
  # adjustment").
  - slug: pretrial_release_observed_expected
    name: Pretrial releases, observed to expected
    kind: observed_expected
    subject_types: [judge]
    population: pretrial_decisions
    description: >-
      The judge's pretrial releases over the number the outcome model expects
      for the same decisions under the source's average practice, partially
      pooled toward 1 (an association with the judge's decisions, not a causal
      effect).
    numerator: >-
      Observed releases: the attributed pretrial decisions with detained =
      false (pretrial_released).
    denominator: >-
      Expected releases: the sum over the same decisions of the outcome model's
      predicted probability of release (target pretrial_release), from the
      published coefficients; a decision whose model features are missing under
      an exclude rule is outside the ratio and counted in the eligible count.
    eligibility: >-
      The attributed pretrial decisions of pretrial_decisions; every decision
      carries a detained flag, so the denominator is the whole set.
    attribution:
      decision_type: pretrial_release
      actor_types: [judge]
      discretion: [discretionary]
      assignment_gate: deciding_judge
    index_event: null
    outcome: null
    windows_days: null
    dimension: null
    suppression_threshold: 30
    unit: ratio
    version: "1"
    adjustment:
      target: pretrial_release
      minimum_expected: 5

