[project]
name = "judgemetrics"
version = "0.1.0"
description = "Transparent, reproducible analytics over public criminal-court records: judicial assignments, case events, dispositions, sentences, and documented subsequent outcomes, with provenance and uncertainty."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Nathan Ramos", email = "nathan.ramos.github@gmail.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
judgemetrics = "judgemetrics.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]
# roadmodel is the planning tool behind ROADMAP.md and docs/phaseNN-roadmap.md
# (`uv run roadmodel export-kit . --force` refreshes planning/). It is not an
# application dependency.
planning = [
    "roadmodel>=0.2.33",
]

[tool.uv]
default-groups = ["dev", "planning"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts", "alembic"]

[tool.ruff.lint]
# Defaults (E4/E7/E9 + F) plus import order (I), likely bugs (B),
# flake8-bandit security rules (S), and modern-syntax upgrades (UP).
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts", "alembic"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Starlette's TestClient still imports httpx 0.x; the project follows
    # FastAPI's supported client.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "unit: fast tests with no external services",
    "integration: tests that need the Compose services (`uv run poe up`)",
]

[tool.bandit]
# SAST for the application package and the migrations; tests are excluded
# (they use asserts and fixtures by design) and are covered by ruff's
# flake8-bandit rules instead.
exclude_dirs = ["tests", ".venv", ".worktrees"]

[tool.coverage.run]
source = ["judgemetrics"]
branch = true

[tool.poe.tasks]
# Cross-platform command interface: `uv run poe <task>`. The Makefile at the
# repo root mirrors these targets for environments that have GNU make.
# Later steps add: dev-web, ingest-fjc, seed, compute-metrics, bootstrap.
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "mypy"
check = ["lint", "fmt-check", "typecheck", "test"]
# The fail-closed security gate: every pre-commit hook, then the pre-push
# stage (pip-audit) so one command runs the whole gate on demand.
gate = ["gate-commit", "gate-push"]
gate-commit = "pre-commit run --all-files"
gate-push = "pre-commit run --all-files --hook-stage pre-push"
kit = "roadmodel export-kit . --force"
# Local services: PostgreSQL 17 (pg_trgm, three roles) and MinIO. `up` waits
# for the long-running services to be healthy, then runs the one-shot
# bucket-creation job (`--wait` alone treats a cleanly exited job as failure).
up = ["up-services", "up-init"]
up-services = "docker compose up -d --wait postgres minio"
up-init = "docker compose run --rm minio-init"
down = "docker compose down"
# Schema and API: migrations run as the admin role (JUDGEMETRICS_ADMIN_DATABASE_URL);
# dev-api serves judgemetrics.main:app with auto-reload.
migrate = "judgemetrics db upgrade"
dev-api = "judgemetrics serve --reload"
